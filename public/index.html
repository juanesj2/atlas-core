<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Satélite Virtual</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .screen-container {
            width: 300px;
            height: 300px;
            border-radius: 50%; /* Simulando la pantalla GC9A01 redonda */
            background-color: #000;
            border: 8px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .state-text {
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }

        .animation-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            opacity: 0.5;
            transition: all 0.5s ease;
        }

        /* Animaciones simuladas */
        .anim-sleeping { background: transparent; }
        .anim-mic_active { background: radial-gradient(circle, #00ff00 0%, transparent 70%); }
        .anim-pulsing_blue {
            background: radial-gradient(circle, #0088ff 0%, transparent 70%);
            animation: pulse 1s infinite alternate;
        }
        .anim-waveform {
            background: radial-gradient(circle, #ff0055 0%, transparent 70%);
            animation: pulse 0.3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 10px;
            width: 80%;
            max-width: 500px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #0088ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0066cc; }

        .response-box {
            margin-top: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 80%;
            max-width: 500px;
            min-height: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>ATLAS Satélite Virtual</h2>

    <div class="screen-container" id="screen">
        <div class="animation-overlay" id="animationLayer"></div>
        <div class="state-text" id="stateText">IDLE</div>
    </div>

    <div class="controls">
        <input type="text" id="commandInput" placeholder="Escribe un comando para Atlas..." onkeypress="handleEnter(event)">
        <button onclick="sendCommand()">Enviar</button>
    </div>

    <div class="response-box" id="responseBox">
        <em>La respuesta de voz simulada de Atlas aparecerá aquí...</em>
    </div>

    <script>
        // Conexión WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        const screen = document.getElementById('screen');
        const stateText = document.getElementById('stateText');
        const animationLayer = document.getElementById('animationLayer');
        const responseBox = document.getElementById('responseBox');
        const input = document.getElementById('commandInput');

        ws.onopen = () => {
            console.log('Conectado al Gateway de Atlas');
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Si es un cambio de estado para la pantalla GC9A01
            if (data.state && data.animation) {
                stateText.innerText = data.state;
                animationLayer.className = `animation-overlay anim-${data.animation}`;
                
                // Efecto de anillo exterior
                if(data.state === 'THINKING') screen.style.borderColor = '#0088ff';
                else if(data.state === 'SPEAKING') screen.style.borderColor = '#ff0055';
                else if(data.state === 'LISTENING') screen.style.borderColor = '#00ff00';
                else screen.style.borderColor = '#333';
            }

            // Si es la respuesta textual que leería el TTS
            if (data.type === 'text_response') {
                responseBox.innerHTML = `<strong>Atlas:</strong> ${data.text}`;
            }
        };

        function sendCommand() {
            const text = input.value.trim();
            if (!text) return;
            
            // Limpiar caja de respuesta
            responseBox.innerHTML = '<em>Pensando...</em>';
            
            // Enviar el comando de texto como si fuera el audio transcrito
            ws.send(JSON.stringify({ event: 'TEXT_COMMAND', text: text }));
            
            input.value = '';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendCommand();
        }
    </script>
</body>
</html>
