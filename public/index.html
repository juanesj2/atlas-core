<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Satélite Virtual</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .screen-container { width: 300px; height: 300px; border-radius: 50%; background-color: #000; border: 8px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); position: relative; overflow: hidden; transition: all 0.5s ease; flex-shrink: 0; }
        .state-text { font-size: 24px; font-weight: bold; z-index: 10; }
        .animation-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%; opacity: 0.5; transition: all 0.5s ease; }
        
        .anim-sleeping { background: transparent; }
        .anim-mic_active { background: radial-gradient(circle, #00ff00 0%, transparent 70%); }
        .anim-pulsing_blue { background: radial-gradient(circle, #0088ff 0%, transparent 70%); animation: pulse 1s infinite alternate; }
        .anim-waveform { background: radial-gradient(circle, #ff0055 0%, transparent 70%); animation: pulse 0.3s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.3; } 100% { transform: scale(1.1); opacity: 0.8; } }

        .chat-container { margin-top: 20px; width: 80%; max-width: 600px; height: 250px; background: #2a2a2a; border-radius: 12px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 75%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg.user { background: #0088ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.atlas { background: #444; color: #eee; align-self: flex-start; border-bottom-left-radius: 2px; }

        .controls { margin-top: 20px; display: flex; gap: 10px; width: 80%; max-width: 600px; align-items: center; }
        input[type="text"] { flex-grow: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; background: #333; color: white; }
        input[type="text"]:focus { outline: 2px solid #0088ff; }
        select { padding: 12px; border-radius: 8px; background: #444; color: white; border: none; font-weight: bold; cursor: pointer; }
        button { padding: 12px 20px; background-color: #0088ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #0066cc; }
        .btn-mic { background-color: #ff0055; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .btn-mic.recording { animation: pulse 0.5s infinite alternate; background-color: #ff0000; box-shadow: 0 0 15px red; }
        
        /* Modal Skills */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #222; width: 90%; max-width: 500px; padding: 20px; border-radius: 12px; border: 1px solid #444; color: white; display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .modal-header h2 { margin: 0; }
        .close-btn { background: transparent; color: #aaa; font-size: 24px; border: none; cursor: pointer; padding: 0; width: 30px; height: 30px; }
        .close-btn:hover { color: white; background: transparent; }
        .skills-list { overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 10px; }
        .skill-card { background: #333; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #555; }
        .toggle-btn { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 12px; background: #555; color: white; }
        .toggle-btn.active { background: #00ff00; color: #000; box-shadow: 0 0 10px rgba(0,255,0,0.3); }
    </style>
</head>
<body>
    <!-- Modal Skills -->
    <div class="modal-overlay" id="skillsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Gestor de Extensiones</h2>
                <button class="close-btn" onclick="closeSkillsManager()">&times;</button>
            </div>
            <div class="skills-list" id="skillsList">
                <!-- Se rellena por JS -->
            </div>
            <div style="margin-top:20px; text-align:center; font-size:12px; color:#888;">
                Para añadir nuevas skills, guarda el archivo .js en la carpeta src/skills/ del servidor.
            </div>
        </div>
    </div>

    <div class="screen-container" id="screen">
        <div class="animation-overlay" id="animationLayer"></div>
        <div class="state-text" id="stateText">IDLE</div>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="msg atlas">Hola, soy Atlas. ¿En qué puedo ayudarte?</div>
    </div>

    <div class="controls">
        <button onclick="openSkillsManager()" title="Gestionar Extensiones" style="padding: 10px; background: #444;">⚙️</button>
        <input type="text" id="identityInput" placeholder="Desconocido" value="" title="Identidad detectada" style="width: 100px; border-radius: 20px; border: none; padding: 10px; background: #333; color: white;">
        <select id="voiceSelect" title="Seleccionar Voz">
            <option value="male">👨 Voz Masculina (Álvaro)</option>
            <option value="female">👩 Voz Femenina (Elvira)</option>
        </select>
        <button class="btn-mic" id="micButton" onclick="toggleMic()">🎤</button>
        <input type="text" id="commandInput" placeholder="Escribe o pulsa el micro..." onkeypress="handleEnter(event)">
        <button onclick="sendCommandText()">Enviar</button>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        ws.binaryType = 'arraybuffer';

        const screen = document.getElementById('screen');
        const stateText = document.getElementById('stateText');
        const animationLayer = document.getElementById('animationLayer');
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('commandInput');
        const micButton = document.getElementById('micButton');
        const voiceSelect = document.getElementById('voiceSelect');
        const identityInput = document.getElementById('identityInput');

        let isRecording = false;
        
        // --- SPEECH RECOGNITION (STT Nativo del navegador) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                micButton.classList.add('recording');
                ws.send(JSON.stringify({ event: 'WAKE_WORD_DETECTED' }));
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                appendMessage('user', transcript);
                ws.send(JSON.stringify({ 
                    event: 'TEXT_COMMAND', 
                    text: transcript,
                    voice: voiceSelect.value,
                    identity: identityInput.value.trim(),
                    isSpoken: true
                }));
            };

            recognition.onerror = (event) => {
                console.error("Error en reconocimiento de voz: ", event.error);
                appendMessage('atlas', '⚠️ Hubo un error al escuchar tu micrófono.');
            };

            recognition.onend = () => {
                isRecording = false;
                micButton.classList.remove('recording');
            };
        } else {
            console.warn("SpeechRecognition no está soportado en este navegador.");
        }

        ws.onopen = () => console.log('Conectado al Gateway de Atlas');

        ws.onmessage = async (event) => {
            // Manejo de AUDIO (Binario) desde el TTS de Atlas
            if (event.data instanceof ArrayBuffer) {
                const audioBlob = new Blob([event.data], { type: 'audio/wav' });
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();
                return;
            }

            // Manejo de ESTADOS (JSON)
            const data = JSON.parse(event.data);
            if (data.state && data.animation) {
                stateText.innerText = data.state;
                animationLayer.className = `animation-overlay anim-${data.animation}`;
                
                if(data.state === 'THINKING') screen.style.borderColor = '#0088ff';
                else if(data.state === 'SPEAKING') screen.style.borderColor = '#ff0055';
                else if(data.state === 'LISTENING') screen.style.borderColor = '#00ff00';
                else screen.style.borderColor = '#333';
            }

            if (data.type === 'text_response') {
                appendMessage('atlas', data.text);
            }
        };

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function toggleMic() {
            if (!recognition) {
                alert("Tu navegador no soporta reconocimiento de voz nativo. Usa texto.");
                return;
            }
            if (!isRecording) {
                recognition.start();
            } else {
                recognition.stop();
            }
        }

        function sendCommandText() {
            const text = input.value.trim();
            if (!text) return;
            appendMessage('user', text);
            ws.send(JSON.stringify({ 
                event: 'TEXT_COMMAND', 
                text: text,
                voice: voiceSelect.value,
                identity: identityInput.value.trim(),
                isSpoken: false
            }));
            input.value = '';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendCommandText();
        }

        // --- GESTOR DE SKILLS ---
        async function openSkillsManager() {
            document.getElementById('skillsModal').style.display = 'flex';
            loadSkillsList();
        }

        function closeSkillsManager() {
            document.getElementById('skillsModal').style.display = 'none';
        }

        async function loadSkillsList() {
            const listDiv = document.getElementById('skillsList');
            listDiv.innerHTML = '<p>Cargando extensiones...</p>';
            try {
                const res = await fetch('/api/skills');
                const skills = await res.json();
                listDiv.innerHTML = '';
                skills.forEach(s => {
                    const skillCard = document.createElement('div');
                    skillCard.className = 'skill-card';
                    skillCard.innerHTML = `
                        <div>
                            <strong>${s.name.toUpperCase()}</strong>
                            <div style="font-size:12px; color:#aaa; margin-top:5px;">Archivo: ${s.filename}</div>
                        </div>
                        <button class="toggle-btn ${s.active ? 'active' : ''}" onclick="toggleSkill('${s.filename}', ${!s.active})">
                            ${s.active ? 'ON' : 'OFF'}
                        </button>
                    `;
                    listDiv.appendChild(skillCard);
                });
            } catch (e) {
                listDiv.innerHTML = '<p style="color:red">Error cargando skills.</p>';
            }
        }

        async function toggleSkill(filename, activate) {
            try {
                const res = await fetch('/api/skills/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, activate })
                });
                if (res.ok) {
                    loadSkillsList(); // Recargar lista visual
                } else {
                    alert("Error al cambiar estado de la skill");
                }
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
